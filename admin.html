<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin - Torneio UDV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header class="hero admin-hero"><div class="hero-top"><img class="brand-logo" src="assets/torneio-verao-logo.png" alt="Torneio de Verão UDV"><div><p class="club">PAINEL ADMIN</p><h1><span>Resultados</span><small>e marcadores</small></h1></div></div></header>
  <nav class="tabs"><a href="index.html">Voltar &agrave; app</a></nav>
  <main>
    <section class="panel admin-card">
      <h2>Inserir resultado</h2>
      <p class="hint">Se ainda n&atilde;o configuraste o Google Apps Script, os dados ficam apenas guardados neste dispositivo. Depois de configurares o backend, ficam p&uacute;blicos para todos.</p>
      <form id="adminForm">
        <label>Chave admin<input type="password" id="adminKey" placeholder="Chave privada" required/></label><label>Jogo<select id="matchSelect" required></select></label>
        <div class="score-row"><label>Golos <span id="homeTeamLabel">equipa casa</span><input type="number" id="homeGoals" min="0" required/></label><label>Golos <span id="awayTeamLabel">equipa fora</span><input type="number" id="awayGoals" min="0" required/></label></div>
        <label>Marcadores <span id="homeScorersLabel">equipa casa</span><br><small>Um por linha no formato: Jogador;Golos</small><textarea id="scorersHome" placeholder="Ex.: Rui Silva;2"></textarea></label>
        <label>Marcadores <span id="awayScorersLabel">equipa fora</span><br><small>Um por linha no formato: Jogador;Golos</small><textarea id="scorersAway" placeholder="Ex.: Jo&atilde;o Costa;1"></textarea></label>
        <button class="primary" type="submit">Guardar resultado</button>
      </form>
      <div id="adminStatus" class="status"></div>
    </section>
  </main>
  <script src="js/config.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/admin.js"></script>
</body>
</html>
